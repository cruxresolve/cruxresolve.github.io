name: Verify live WebP render

on:
  push:
    paths:
      - '.github/workflows/verify-webp-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify WebP renders on live page
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            let webpResponse = null;

            page.on('response', response => {
              if (response.url().includes('/assets/webp-test/ghostbridge-enclosure-test.webp')) {
                webpResponse = response;
              }
            });

            await page.goto('https://cruxresolve.com/blog/designing-the-ghostbridge-enclosure.html', {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            const selector = 'img[src="/assets/webp-test/ghostbridge-enclosure-test.webp"]';
            await page.waitForSelector(selector, { state: 'visible', timeout: 30000 });

            const result = await page.$eval(selector, img => ({
              complete: img.complete,
              naturalWidth: img.naturalWidth,
              naturalHeight: img.naturalHeight,
              renderedWidth: img.getBoundingClientRect().width,
              renderedHeight: img.getBoundingClientRect().height,
              currentSrc: img.currentSrc
            }));

            console.log('WEBP_RENDER_RESULT=' + JSON.stringify(result));
            if (webpResponse) {
              console.log('WEBP_HTTP_STATUS=' + webpResponse.status());
              console.log('WEBP_CONTENT_TYPE=' + (await webpResponse.headerValue('content-type')));
            }

            if (!result.complete || result.naturalWidth <= 0 || result.naturalHeight <= 0 || result.renderedWidth <= 0 || result.renderedHeight <= 0) {
              throw new Error('WebP image did not render correctly.');
            }
            if (!result.currentSrc.endsWith('/assets/webp-test/ghostbridge-enclosure-test.webp')) {
              throw new Error('Browser did not render the expected WebP source.');
            }
            if (!webpResponse || webpResponse.status() !== 200) {
              throw new Error('WebP network response was not HTTP 200.');
            }

            await page.screenshot({ path: 'webp-live-proof.png', fullPage: true });
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload proof screenshot
        uses: actions/upload-artifact@v4
        with:
          name: webp-live-proof
          path: webp-live-proof.png
          if-no-files-found: error

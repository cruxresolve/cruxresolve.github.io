name: Generate WebP test asset

on:
  push:
    paths:
      - '.github/workflows/generate-webp-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate small WebP from existing GhostBridge image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('assets/gb_sheet.jpg')
          output = Path('assets/webp-test/ghostbridge-enclosure-test.webp')
          output.parent.mkdir(parents=True, exist_ok=True)

          with Image.open(source) as im:
              im = im.convert('RGB')
              im.thumbnail((320, 240), Image.Resampling.LANCZOS)
              im.save(output, 'WEBP', quality=82, method=6)

          print(f'created {output} ({output.stat().st_size} bytes)')
          PY

      - name: Commit generated WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/webp-test/ghostbridge-enclosure-test.webp
          if git diff --cached --quiet; then
            echo "No WebP change to commit."
          else
            git commit -m "Add small WebP rendering test asset"
            git push
          fi

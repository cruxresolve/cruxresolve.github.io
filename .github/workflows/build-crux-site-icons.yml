name: Build CR site icons

on:
  push:
    paths:
      - '.github/workflows/build-crux-site-icons.yml'

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate reviewed CR icon set
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('assets/crux-resolve-header.webp')
          image = Image.open(source).convert('RGB')

          # Reviewed crop: keeps the dimensional red C / silver R dominant
          # and remains recognizable at 32px favicon size.
          crop = image.crop((80, 180, 760, 860))

          def png(size, path, colors):
              resized = crop.resize((size, size), Image.Resampling.LANCZOS)
              quantized = resized.quantize(colors=colors, method=Image.Quantize.MEDIANCUT)
              quantized.save(path, optimize=True)

          png(512, 'assets/crux-site-icon.png', 256)
          png(180, 'assets/apple-touch-icon.png', 256)

          ico = crop.resize((256, 256), Image.Resampling.LANCZOS)
          ico.save(
              'favicon.ico',
              format='ICO',
              sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)]
          )
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/crux-site-icon.png assets/apple-touch-icon.png favicon.ico
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "Add dimensional CR site icons"
            git push
          fi

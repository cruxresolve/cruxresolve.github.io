name: Import header WebP

on:
  push:
    paths:
      - '.github/workflows/import-header-webp.yml'
      - '.github/header-transfer/part10.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct header WebP
        run: |
          cat .github/header-transfer/part*.txt | tr -d '\n\r' | base64 --decode > assets/crux-resolve-header.webp
          test "$(stat -c%s assets/crux-resolve-header.webp)" = "119706"
          echo "6b799a888af405533e839eb674ed79104d5d16a78d954fda897d9399c580990c  assets/crux-resolve-header.webp" | sha256sum -c -
          file assets/crux-resolve-header.webp

      - name: Commit WebP asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/crux-resolve-header.webp
          if git diff --cached --quiet; then
            echo "Header WebP already matches."
          else
            git commit -m "Add Crux Resolve header WebP"
            git push
          fi

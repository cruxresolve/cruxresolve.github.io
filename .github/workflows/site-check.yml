name: Website integrity checks

on:
  pull_request:
    paths:
      - "**.html"
      - "assets/**"
      - "scripts/check_site.py"
      - "scripts/check_live_site.py"
      - "scripts/submit_indexnow.py"
      - ".github/workflows/site-check.yml"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "a30252b4152841dbbd7ec13fe4e10dd2.txt"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/**"
      - "scripts/check_site.py"
      - "scripts/check_live_site.py"
      - "scripts/submit_indexnow.py"
      - ".github/workflows/site-check.yml"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "a30252b4152841dbbd7ec13fe4e10dd2.txt"

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Validate pages, includes, links, and accessibility structure
        id: site_check
        continue-on-error: true
        shell: bash
        run: python3 scripts/check_site.py > site-validation-report.txt 2>&1
      - name: Validate company email address
        id: email_check
        continue-on-error: true
        shell: bash
        run: |
          # Inspect public/site content only. Validation scripts can intentionally
          # contain stale addresses as negative test fixtures and must not be
          # treated as customer-facing contact information.
          addresses="$(grep -RhoE '[A-Za-z0-9._%+-]+@cruxresolve\.com' --include='*.html' --include='*.md' --include='*.txt' --include='*.xml' --include='*.yml' --include='*.yaml' --include='*.js' . | sort -u || true)"
          printf '%s\n' "$addresses" >> site-validation-report.txt
          test "$addresses" = "support@cruxresolve.com"
      - name: Validate AI reference file
        id: llms_check
        continue-on-error: true
        shell: bash
        run: |
          test -f llms.txt
          grep -Fq 'https://cruxresolve.com/ghosttune-app.html' llms.txt
          grep -Fq 'https://cruxresolve.com/ghostbridge.html' llms.txt
          grep -Fq 'https://apps.apple.com/us/app/id6778061607' llms.txt
          grep -Fq 'Blog articles document the state of products on their publication dates' llms.txt
          printf '%s\n' 'llms.txt authoritative references verified' >> site-validation-report.txt
      - name: Validate IndexNow key file
        id: indexnow_key_check
        continue-on-error: true
        shell: bash
        run: |
          key_file='a30252b4152841dbbd7ec13fe4e10dd2.txt'
          test -f "$key_file"
          test "$(tr -d '\r\n' < "$key_file")" = "${key_file%.txt}"
          printf '%s\n' 'IndexNow root key verified' >> site-validation-report.txt
      - name: Validate automation script syntax
        id: python_check
        continue-on-error: true
        shell: bash
        run: |
          python3 -m py_compile scripts/check_site.py scripts/check_live_site.py scripts/submit_indexnow.py
          printf '%s\n' 'Python validation scripts compile successfully' >> site-validation-report.txt
      - name: Validate JavaScript syntax
        id: js_check
        continue-on-error: true
        shell: bash
        run: |
          node --check assets/js/site.js >> site-validation-report.txt 2>&1
          node --check assets/js/analytics-consent.js >> site-validation-report.txt 2>&1
      - name: Upload source validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-validation-report
          path: site-validation-report.txt
          if-no-files-found: error
      - name: Report source validation result
        if: always()
        shell: bash
        run: |
          cat site-validation-report.txt
          test "${{ steps.site_check.outcome }}" = "success"
          test "${{ steps.email_check.outcome }}" = "success"
          test "${{ steps.llms_check.outcome }}" = "success"
          test "${{ steps.indexnow_key_check.outcome }}" = "success"
          test "${{ steps.python_check.outcome }}" = "success"
          test "${{ steps.js_check.outcome }}" = "success"

  validate-live-site:
    needs: validate-source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 0
      - name: Defer live deployment validation until merge
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "Source validation passed. The public-site deployment check runs after this pull request is merged to main."
      - name: Verify rendered public pages
        if: github.event_name == 'push'
        id: live_check
        continue-on-error: true
        shell: bash
        run: python3 scripts/check_live_site.py > live-site-report.txt 2>&1
      - name: Upload live-site report
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-report
          path: live-site-report.txt
          if-no-files-found: error
      - name: Report live-site validation result
        if: github.event_name == 'push' && always()
        shell: bash
        run: |
          cat live-site-report.txt
          test "${{ steps.live_check.outcome }}" = "success"
      - name: Notify IndexNow of changed public URLs
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INDEXNOW_KEY_FILE: a30252b4152841dbbd7ec13fe4e10dd2.txt
          INDEXNOW_ENDPOINT: https://api.indexnow.org/indexnow
        shell: bash
        run: python3 scripts/submit_indexnow.py

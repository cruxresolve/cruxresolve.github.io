name: Website integrity checks

on:
  pull_request:
    paths:
      - "**.html"
      - "assets/**"
      - "scripts/check_site.py"
      - ".github/workflows/site-check.yml"
      - "robots.txt"
      - "sitemap.xml"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/**"
      - "scripts/check_site.py"
      - ".github/workflows/site-check.yml"
      - "robots.txt"
      - "sitemap.xml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pages, includes, links, and accessibility structure
        run: python scripts/check_site.py
      - name: Validate JavaScript syntax
        run: node --check assets/js/site.js

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Crux Resolve LLC</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/assets/ghosttune-app-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:     #080b12;
      --bg-panel:    #0e1420;
      --orange:      #FF6A00;
      --orange-glow: #FFB347;
      --orange-dim:  #cc5500;
      --text-primary:#e8eaf0;
      --text-muted:  #8a9ab8;
      --text-dim:    #5a6a88;
      --border:      rgba(255,106,0,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px 24px;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }
    .glow {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(255,106,0,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 520px;
    }
    .error-code {
      font-family: 'Orbitron', monospace;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-glow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.9;
    }
    .eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--orange-dim);
      text-transform: uppercase;
    }
    .headline {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .sub {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 400px;
    }
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.03em;
    }
    .btn-primary:hover { background: var(--orange-glow); transform: translateY(-1px); }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      border: 1px solid rgba(255,106,0,0.2);
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--orange); color: var(--orange-glow); }
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--orange-dim), transparent);
    }
    .footer-note {
      position: fixed;
      bottom: 24px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
    }
    .footer-note a { color: var(--orange-dim); text-decoration: none; }
    .footer-note a:hover { color: var(--orange); }

    /* ── ACCESSIBILITY ── */
    /* Skip nav */
    .skip-nav {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--orange);
      color: #fff;
      padding: 8px 16px;
      border-radius: 0 0 6px 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      z-index: 9999;
      transition: top 0.2s;
    }
    .skip-nav:focus { top: 0; }

    /* Focus styles */
    *:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
      border-radius: 3px;
    }
    button:focus-visible,
    a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

    /* Fix text-dim contrast — boost it slightly */
    :root { --text-dim: #6e82a8; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-nav">Skip to main content</a>

  <div class="glow"></div>

  <div class="content" id="main-content">
    <div class="eyebrow">// ERROR · PAGE NOT FOUND</div>
    <div class="error-code">404</div>
    <div class="divider"></div>
    <div class="headline">Nothing to tune here.</div>
    <p class="sub">
      The page you're looking for doesn't exist or may have moved.
      Head back and find what you need.
    </p>
    <div class="links">
      <a class="btn-primary" href="/">← Back to GhostTune</a>
      <a class="btn-ghost" href="/ghostbridge.html">GhostBridge</a>
      <a class="btn-ghost" href="/support.html">Support</a>
    </div>
  </div>

  <div class="footer-note">
    <a href="/">cruxresolve.com</a> &nbsp;·&nbsp; Crux Resolve LLC
  </div>

</body>
</html>
